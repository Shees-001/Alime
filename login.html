<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | ALIMÈ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link href="CSS/style.css" rel="stylesheet">
</head>
<body>
<main class="row g-0 login-wrap">

  <!-- LEFT PANEL -->
<!-- LEFT PANEL -->
<section class="col-lg-6 d-none d-lg-flex flex-column justify-content-between login-left">
  <a href="home.html"><img src="Images/logo.jpeg" alt="ALIMÈ Fashion Accessories"></a>
  <div class="login-left-text">
    <span class="circle-lg"></span>
    <span class="circle-sm"></span>
    <span class="label">Admin panel</span>
    <h1 class="mt-3 mb-4">A little style,<br>a lot of you.</h1>
    <p class="mb-0">Sign in to manage products, orders and customers for your store.</p>
  </div>
  <small class="login-muted">© ALIMÈ Fashion Accessories</small>
</section>

  <!-- RIGHT: FORM -->
  <section class="col-lg-6 d-flex align-items-center justify-content-center login-right">
    <form class="login-form" id="loginForm">
      <a href="home.html" class="d-lg-none d-inline-block mb-4"><img src="Images/logo.jpeg" alt="ALIMÈ" class="login-logo-sm"></a>
      <h2 class="display-6">Login</h2>
      <p class="login-muted mb-4">Only authorised admins can access this panel.</p>

      <div class="mb-3">
        <label for="email" class="form-label">UserName</label>
        <input type="text" class="form-control" id="username" placeholder="Enter User Name" autocomplete="username">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password">
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4 small">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <a href="#" class="contact-link">Forgot password?</a>
      </div>

      <button type="button" class="btn btn-alime w-100" id="login">Login</button>

      <p class="text-center mt-4 mb-0"><a href="home.html" class="contact-link">Back to website</a></p>
    </form>
  </section>

</main>
<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function(){
        $("#login").click(function(){
            var userName = $("#username").val();
            var userPass = $("#password").val();

            if(userName == "" || userPass == ""){
                alert("Please Fill All Fields");
            }else{
                if(userName == "admin" && userPass =="admin"){
                    window.location.href = "dashboard.html";
                }else{
                    alert("Invalid UserName or Password")
                 }
            }

            


        })
    })
</script>

</body>
</html>
