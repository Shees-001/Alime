<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | ALIMÈ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link href="CSS/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="home.html"><img src="Images/logo.jpeg" alt="ALIMÈ Fashion Accessories"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse justify-content-end" id="menu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="section bg-blush">
  <div class="container">
    <div class="text-center mb-5">
      <span class="label">Get in touch</span>
      <h1 class="display-5 mt-2">Contact Us</h1>
      <p class="mx-auto" style="max-width:520px">Questions about an order or a product? Send us a message and we will reply as soon as we can.</p>
    </div>

    <div class="row g-4 justify-content-center">
      <!-- INFO -->
      <div class="col-lg-5">
        <div class="contact-card d-flex align-items-center gap-3 mb-3">
          <span class="icon-circle"><i class="bi bi-person"></i></span>
          <div><small class="text-muted">Name</small><div class="fw-medium">[My Name]</div></div>
        </div>
        <div class="contact-card d-flex align-items-center gap-3 mb-3">
          <span class="icon-circle"><i class="bi bi-telephone"></i></span>
          <div><small class="text-muted">Phone</small><div class="fw-medium">[My Number]</div></div>
        </div>
        <div class="contact-card d-flex align-items-center gap-3 mb-3">
          <span class="icon-circle"><i class="bi bi-instagram"></i></span>
          <div><small class="text-muted">Instagram</small><div class="fw-medium"><a href="#" class="contact-link">[My Link]</a></div></div>
        </div>
        <div class="contact-card d-flex align-items-center gap-3">
          <span class="icon-circle"><i class="bi bi-geo-alt"></i></span>
          <div><small class="text-muted">City</small><div class="fw-medium">Karachi</div></div>
        </div>
      </div>

      <!-- FORM -->
      <div class="col-lg-6">
        <form class="contact-card p-4" id="contactForm">
          <div class="mb-3">
            <label for="cName" class="form-label">Your name</label>
            <input type="text" class="form-control" id="cName" placeholder="e.g. Ayesha Khan">
          </div>
          <div class="mb-3">
            <label for="cPhone" class="form-label">Phone number</label>
            <input type="tel" class="form-control" id="cPhone" placeholder="03XX XXXXXXX">
          </div>
          <div class="mb-4">
            <label for="cMsg" class="form-label">Message</label>
            <textarea class="form-control" id="cMsg" rows="4" placeholder="How can we help you?"></textarea>
          </div>
          <button type="submit" class="btn btn-alime w-100">Message Us</button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container text-center">
    <span>© ALIMÈ Fashion Accessories</span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
