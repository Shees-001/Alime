<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products | ALIMÈ Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link href="CSS/style.css" rel="stylesheet">
  <link href="CSS/admin.css" rel="stylesheet">
</head>
<body class="admin-body">
<div class="admin-shell">

  <!-- SIDEBAR -->
  <div class="side-col">
    <aside class="offcanvas-lg offcanvas-start admin-side" tabindex="-1" id="sidebar" aria-label="Admin menu">
      <div class="offcanvas-header d-lg-none">
        <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column">
        <img src="Images/logo.jpeg" alt="ALIMÈ" class="admin-logo">
        <ul class="admin-nav">
          <li><a href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a></li>
          <li><a href="products.html" class="active"><i class="bi bi-bag"></i> Products</a></li>
          <li><a href="#"><i class="bi bi-receipt"></i> Orders</a></li>
          <li><a href="#"><i class="bi bi-people"></i> Customers</a></li>
          <li><a href="#"><i class="bi bi-gear"></i> Settings</a></li>
        </ul>
        <ul class="admin-nav admin-logout">
          <li><a href="login.html"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
        </ul>
      </div>
    </aside>
  </div>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-top">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-alime d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Open menu"><i class="bi bi-list"></i></button>
        <div>
          <h1 class="h2 mb-0">Products</h1>
          <small class="login-muted">Add, edit or hide products on the shop page</small>
        </div>
      </div>
      <div class="avatar">A</div>
    </div>

    <div class="row g-3 align-items-start">
      <!-- PRODUCT TABLE -->
    <div class="col-xl-8">
      <div class="admin-card">
        <div id="tableWrap" class="table-responsive d-none">
          <table class="table admin-table align-middle mb-0">
            <thead><tr><th>Product</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="productTable"></tbody>
          </table>
        </div>

        <div id="emptyProducts" class="text-center py-5">
          <i class="bi bi-bag fs-1" style="color:var(--rose)"></i>
          <h2 class="h4 mt-2">No products yet</h2>
          <p class="login-muted mb-0">A Little Style, A Lot of You.</p>
        </div>
      </div>
    </div>

      <!-- ADD PRODUCT FORM -->
      <div class="col-xl-4">
        <form class="admin-card" id="productForm">
          <h2 class="h4 mb-3">Add new product</h2>
          <div class="mb-3">
            <label for="pName" class="form-label">Product name</label>
            <input type="text" class="form-control" id="pName" placeholder="Enter Product Name" required>
          </div>
          <div class="mb-3">
            <label for="pPrice" class="form-label">Price (Rs)</label>
            <input type="number" class="form-control" id="pPrice" placeholder="Enter Price" min="0" required>
          </div>
          <div class="mb-3">
            <label for="pCat" class="form-label">Category</label>
            <select class="form-select form-control" id="pCat">
              <option>Hair accessories</option>
              <option>Jewelry</option>
              <option>Bags</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="pImg" class="form-label">Product image</label>
            <div class="upload-box"><input type="file" class="form-control" id="pImg" accept="image/*" required></div>
          </div>
          <div class="mb-4">
            <label for="pDesc" class="form-label">Description</label>
            <textarea class="form-control" id="pDesc" rows="3" placeholder="Short description"></textarea>
          </div>
          <button type="submit" class="btn btn-alime w-100">Save product</button>
        </form>
      </div>
    </div>
  </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JS/products.js"></script>
<script src="JS/add-products.js"></script>
</body>
</html>
